name: Update PromptKit Dependency

on:
  repository_dispatch:
    types: [promptkit-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update PromptKit to ${{ github.event.client_payload.version }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'

    - name: Update go.mod
      env:
        VERSION: ${{ github.event.client_payload.version }}
      run: |
        echo "Updating PromptKit runtime to $VERSION..."

        # Update required versions for all PromptKit modules
        go mod edit -require="github.com/AltairaLabs/PromptKit/runtime@$VERSION"
        go mod edit -require="github.com/AltairaLabs/PromptKit/sdk@$VERSION"
        go mod edit -require="github.com/AltairaLabs/PromptKit/server/a2a@$VERSION"
        go mod edit -require="github.com/AltairaLabs/PromptKit/pkg@$VERSION"

        # Tidy to resolve dependencies
        go mod tidy

        echo "✓ Updated go.mod"

    - name: Verify build
      run: |
        echo "Verifying build..."
        go build -o promptarena-deploy-agentcore .
        echo "✓ Build succeeded"

    - name: Verify tests
      run: |
        echo "Running tests..."
        go test ./... -v -race -count=1
        echo "✓ Tests passed"

    - name: Create pull request
      env:
        VERSION: ${{ github.event.client_payload.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH="deps/promptkit-$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add -A
        git commit -s -m "deps: update PromptKit modules to $VERSION" \
          -m "Bump runtime, sdk, server/a2a and pkg to the newly published version."

        git push origin "$BRANCH"

        # Quoted heredoc so backticks are not evaluated; __VERSION__ is
        # substituted afterwards.
        cat <<'PREOF' > /tmp/pr-body.md
        ## Summary

        - Update the `github.com/AltairaLabs/PromptKit/*` modules to `__VERSION__`

        Triggered automatically by PromptKit release `__VERSION__`.

        ## Verification

        - [x] `go build` passes
        - [x] `go test ./... -race` passes

        🤖 Generated automatically by the update-deps workflow
        PREOF

        sed -i "s/__VERSION__/$VERSION/g" /tmp/pr-body.md

        gh pr create \
          --title "deps: update PromptKit modules to $VERSION" \
          --body-file /tmp/pr-body.md

        echo "✓ Created PR for $BRANCH"
