name: Update upstream dependencies

# Two upstreams now, not one. The deploy contract (runtime/deploy and
# adaptersdk) moved out of PromptKit into promptarena, so a release there
# reaches this adapter only if we listen for it — which nothing did, leaving the
# module that defines the adapter's own interface with no update path at all.
on:
  repository_dispatch:
    types: [promptkit-release, promptarena-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update ${{ github.event.action }} to ${{ github.event.client_payload.version }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'

    - name: Update go.mod
      env:
        VERSION: ${{ github.event.client_payload.version }}
        # Read from the environment rather than interpolated into the script:
        # a dispatch payload is attacker-controlled input to a shell otherwise.
        EVENT: ${{ github.event.action }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          echo "Updating promptarena to $VERSION..."
          go mod edit -require="github.com/AltairaLabs/promptarena@$VERSION"
        else
          echo "Updating PromptKit modules to $VERSION..."
          go mod edit -require="github.com/AltairaLabs/PromptKit/runtime@$VERSION"
          go mod edit -require="github.com/AltairaLabs/PromptKit/sdk@$VERSION"
          go mod edit -require="github.com/AltairaLabs/PromptKit/server/a2a@$VERSION"
          go mod edit -require="github.com/AltairaLabs/PromptKit/pkg@$VERSION"
        fi

        # Tidy to resolve dependencies
        go mod tidy

        echo "✓ Updated go.mod"

    - name: Verify build
      run: |
        echo "Verifying build..."
        go build -o promptarena-deploy-agentcore .
        echo "✓ Build succeeded"

    - name: Verify tests
      run: |
        echo "Running tests..."
        go test ./... -v -race -count=1
        echo "✓ Tests passed"

    - name: Create pull request
      env:
        VERSION: ${{ github.event.client_payload.version }}
        EVENT: ${{ github.event.action }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          UPSTREAM="promptarena"
        else
          UPSTREAM="PromptKit"
        fi
        BRANCH="deps/$UPSTREAM-$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add -A
        git commit -s -m "deps: update $UPSTREAM to $VERSION" \
          -m "Triggered by the $UPSTREAM release of $VERSION."

        git push origin "$BRANCH"

        # Quoted heredoc so backticks are not evaluated; __VERSION__ is
        # substituted afterwards.
        cat <<'PREOF' > /tmp/pr-body.md
        ## Summary

        - Update `__UPSTREAM__` to `__VERSION__`

        Triggered automatically by the `__UPSTREAM__` release of `__VERSION__`.

        ## Verification

        - [x] `go build` passes
        - [x] `go test ./... -race` passes

        🤖 Generated automatically by the update-deps workflow
        PREOF

        sed -i "s/__VERSION__/$VERSION/g;s/__UPSTREAM__/$UPSTREAM/g" /tmp/pr-body.md

        gh pr create \
          --title "deps: update $UPSTREAM to $VERSION" \
          --body-file /tmp/pr-body.md

        echo "✓ Created PR for $BRANCH"
